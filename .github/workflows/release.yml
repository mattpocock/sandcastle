name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # The Version Packages PR is pushed with a GitHub App token, not
      # GITHUB_TOKEN: pushes made with GITHUB_TOKEN never trigger workflows,
      # so the PR's required checks would never start. The App (Contents,
      # Pull requests and Workflows: read and write, installed on this repo
      # only) is set up by its owner; see docs/agents/releasing.md.
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # checkout persists this token in the git config, so the changesets
      # action's `git push` of the release branch goes out as the App.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Merging the Version Packages PR publishes. Run `npm run test:local`
      # (real Docker and Podman, which CI lacks) on it first: the title says so
      # where the releaser looks. See docs/agents/releasing.md.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: "Version Packages (run npm run test:local before merging)"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
