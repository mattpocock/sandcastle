name: Release

on:
  push:
    branches:
      - main
      - release/v1

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Merging the Version Packages PR publishes. Run `npm run test:local`
      # (real Docker and Podman, which CI lacks) on it first: the title says so
      # where the releaser looks. See docs/agents/releasing.md.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: "Version Packages (run npm run test:local before merging)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every push to release/v1 publishes a snapshot of the next major under the
  # `v1` dist-tag (e.g. 1.0.0-v1.20261104120000), so v1 can be installed with
  # `npm install @ai-hero/sandcastle@v1` before it ships. The versioning stays
  # in this run's checkout: nothing is committed, pushed or tagged, and
  # `latest` is untouched. It lives in this file because npm trusted
  # publishing is bound to release.yml.
  snapshot:
    name: Publish v1 snapshot
    if: github.ref == 'refs/heads/release/v1' && github.repository == 'mattpocock/sandcastle'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Before the build: tsup bakes package.json's version into dist.
      - name: Version snapshot
        run: npx changeset version --snapshot v1

      - name: Build
        run: npm run build

      - name: Publish snapshot to npm
        run: npx changeset publish --tag v1 --no-git-tag
