name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Merging the Version Packages PR publishes. Run `npm run test:local`
      # (real Docker and Podman, which CI lacks) on it first: the title says so
      # where the releaser looks. See docs/agents/releasing.md.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: "Version Packages (run npm run test:local before merging)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
