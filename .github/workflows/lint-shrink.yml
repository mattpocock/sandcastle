name: Lint shrink baseline

# The lint, test and typecheck ratchets pass when a count falls below their
# baselines (scripts/lint-baseline.json, scripts/test-baseline.json,
# scripts/typecheck-baseline.json), and the e2e coverage floor passes when
# coverage rises above it (scripts/coverage-baseline.json), so fix and
# migration PRs leave them alone. After each push to main this lowers the three
# baselines and raises the floor to what main now has, and opens (or updates)
# one PR with them. It never pushes to main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A newer push to main supersedes an in-flight run: both would write the same
# branch, and the newer one sees the lower counts.
concurrency:
  group: lint-shrink
  cancel-in-progress: true

env:
  BRANCH: chore/lint-shrink-baseline
  TITLE: "chore(lint): shrink baseline"

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      # AGENT_PAT, like the agent workflows: a push made with GITHUB_TOKEN
      # does not trigger CI on the PR, so the PR could never go green.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The type-aware rules need dist (see ci.yml).
      - run: npm run build
      - run: npm run lint:shrink
      # Only ever raises the floor. A failing e2e test fails this step but
      # must not hold back the lint baselines.
      - run: npm run coverage:floor -- --raise
        continue-on-error: true
      - name: Open or update the shrink PR
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- scripts/lint-baseline.json scripts/test-baseline.json scripts/typecheck-baseline.json scripts/coverage-baseline.json; then
            echo "Baseline unchanged."
            exit 0
          fi
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add scripts/lint-baseline.json scripts/test-baseline.json scripts/typecheck-baseline.json scripts/coverage-baseline.json
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          body="Lowers \`scripts/lint-baseline.json\`, \`scripts/test-baseline.json\` and \`scripts/typecheck-baseline.json\` to the violations on main at ${GITHUB_SHA}, and raises the e2e coverage floor in \`scripts/coverage-baseline.json\` to its coverage. Generated by \`npm run lint:shrink\` and \`npm run coverage:floor -- --raise\` in the lint-shrink workflow; counts only fall and the floor only rises."
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
          fi
