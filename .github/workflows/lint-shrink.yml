name: Lint shrink baseline

# The lint ratchet passes when a count falls below scripts/lint-baseline.json,
# so fix PRs leave the baseline alone. After each push to main this lowers the
# baseline to what main now has and opens (or updates) one PR with it. It never
# pushes to main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A newer push to main supersedes an in-flight run: both would write the same
# branch, and the newer one sees the lower counts.
concurrency:
  group: lint-shrink
  cancel-in-progress: true

env:
  BRANCH: chore/lint-shrink-baseline
  TITLE: "chore(lint): shrink baseline"

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      # AGENT_PAT, like the agent workflows: a push made with GITHUB_TOKEN
      # does not trigger CI on the PR, so the PR could never go green.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The type-aware rules need dist (see ci.yml).
      - run: npm run build
      - run: npm run lint:shrink
      - name: Open or update the shrink PR
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- scripts/lint-baseline.json; then
            echo "Baseline unchanged."
            exit 0
          fi
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add scripts/lint-baseline.json
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          body="Lowers \`scripts/lint-baseline.json\` to the violations on main at ${GITHUB_SHA}. Generated by \`npm run lint:shrink\` in the lint-shrink workflow; it only ever lowers counts."
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
          fi
